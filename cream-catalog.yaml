# Корень каталога cream (спека cream §4, §9). version — тег каталога: его
# поднимает release-please (extra-files в .github/release_please/, строка с
# пометкой x-release-please-version), руками не правят. Проверка —
# `cream validate --catalog .` по корню (tools/cream-validate.sh); снимок
# собирает tools/catalog-snapshot.sh из roots этого файла, и roots обязан
# покрывать каждое расширение под extensions/ — скрипт это проверяет.
schema: cream/v1
name: cream-extensions
version: 5.12.0 # x-release-please-version
roots: [extensions/debian, extensions/openwrt]
