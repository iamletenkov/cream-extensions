# Черновик tools/convert-v1.py из layout 2 (code-server 4.0.0): отчёт конвертера — что
# проверить руками (план 2026-10-19-cream-v1-migration, «Порядок перевода одного расширения»).
schema: cream/v1
name: code-server
version: 5.0.0
summary: "code-server в образе"
cream: ">=1.1.1"
platform:
  family: deb
  arch: [amd64, arm64]
targets:
  build: exec
  live: "yes"
provides: [web-ide]
depends:
  - {name: cloud-user}
hooks:
  install: {}
  configure: {stage: cloud-user, timeout: 5m}
  apply: {}
config:
  keys:
    CODE_SERVER_USER:
      type: "re:^[a-zA-Z0-9._-]+$"
      default: ""
      empty: true
      description: "пользователь; пусто — из cloud-init"
    CODE_SERVER_PASSWORD:
      type: "str"
      default: ""
      empty: true
      secret: "file"
      description: "пароль; пусто или none — без аутентификации"
    CODE_SERVER_PORT:
      type: "port"
      default: "9001"
      description: "порт"
    CODE_SERVER_BIND:
      type: "host"
      default: "0.0.0.0"
      description: "адрес прослушивания; 127.0.0.1 закрывает сервер от сети (доступ ssh-туннелем или Teleport)"
