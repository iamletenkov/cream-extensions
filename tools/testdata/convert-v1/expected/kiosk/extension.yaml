# Черновик tools/convert-v1.py из layout 2 (kiosk 3.0.0): отчёт конвертера — что
# проверить руками (план 2026-10-19-cream-v1-migration, «Порядок перевода одного расширения»).
schema: cream/v1
name: kiosk
version: 4.0.0
summary: "Chromium в режиме киоска"
cream: ">=1.1.0"
platform:
  family: deb
  arch: [amd64, arm64]
targets:
  build: exec
  live: "confirm"
  live_note: "захватывает экран: браузер на весь экран после входа"
provides: [kiosk-browser]
requires: [x11-server, display-manager]
depends:
  - {name: cloud-user}
conflicts: {extensions: [chromium-kiosk]}
hooks:
  install: {}
  configure: {stage: graphical, timeout: 5m}
  apply: {}
config:
  keys:
    KIOSK_USER:
      type: "re:^[a-zA-Z0-9._-]+$"
      default: ""
      empty: true
      description: "пользователь киоска; ПЕРЕКРЫВАЕТ cloud-init; пусто — пользователь cloud-init"
    KIOSK_URL:
      type: "str"
      default: "https://github.com/iamletenkov/bisquite"
      description: "страница киоска"
    KIOSK_DISPLAY:
      type: "re:^:[0-9]+(\\.[0-9]+)?$"
      default: ":0"
      description: "X-дисплей Chromium"
    KIOSK_KEYBOARD_ENABLED:
      type: "enum:true,false"
      default: "true"
      description: "экранная клавиатура — только под GNOME"
    KIOSK_CHROMIUM_FLAGS:
      type: "str"
      default: "--disable-pinch --overscroll-history-navigation=0"
      empty: true
      description: "флаги Chromium через пробел, добавляются к базовому набору"
files:
  - {src: kiosk-chromium@.service, dst: /etc/systemd/system/kiosk-chromium@.service, mode: "0644"}
