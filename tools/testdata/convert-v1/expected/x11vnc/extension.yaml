# Черновик tools/convert-v1.py из layout 2 (x11vnc 4.0.0): отчёт конвертера — что
# проверить руками (план 2026-10-19-cream-v1-migration, «Порядок перевода одного расширения»).
schema: cream/v1
name: x11vnc
version: 5.0.0
summary: "VNC-доступ к рабочему столу X11 для пользователя, созданного cloud-init"
cream: ">=1.1.0"
platform:
  family: deb
  arch: [amd64, arm64]
targets:
  build: exec
  live: "yes"
provides: [remote-desktop]
requires: [x11-server, display-manager]
depends:
  - {name: cloud-user}
hooks:
  install: {}
  configure: {stage: graphical, after: [display-manager.service], timeout: 5m}
  apply: {}
config:
  keys:
    X11VNC_PORT:
      type: "port"
      default: "5900"
      description: "порт RFB"
    X11VNC_DISPLAY:
      type: "re:^:[0-9]+(\\.[0-9]+)?$"
      default: ":0"
      description: "X-дисплей"
    X11VNC_LISTEN:
      type: "enum:localhost,all"
      default: "localhost"
      description: "localhost — только петля (доступ ssh-туннелем), all — все интерфейсы"
    X11VNC_PASSWORD:
      type: "str"
      default: ""
      empty: true
      secret: "file"
      description: "пароль VNC; в файл не пишется — хук кладёт /etc/x11vnc/passwd (-rfbauth); пусто — снять пароль"
    X11VNC_PASSFILE:
      type: "path"
      default: ""
      empty: true
      readonly: true
      description: "файл пароля для -rfbauth; пишет хук X11VNC_PASSWORD, пусто — сервер без пароля"
files:
  - {src: x11vnc@.service, dst: /etc/systemd/system/x11vnc@.service, mode: "0644"}
