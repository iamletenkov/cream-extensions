# Черновик tools/convert-v1.py из layout 2 (nvidia-jetpack 2.0.0): отчёт конвертера — что
# проверить руками (план 2026-10-19-cream-v1-migration, «Порядок перевода одного расширения»).
schema: cream/v1
name: nvidia-jetpack
version: 3.0.0
summary: "Превращает обычный amd64-образ Ubuntu 22.04 в станцию прошивки NVIDIA Jetson"
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64]
targets:
  build: exec
  live: "confirm"
  live_note: "станция прошивки: NFS-сервер, binfmt, USB autosuspend; нужен перезапуск systemd-binfmt"
provides: [jetson-flash-station]
hooks:
  install: {}
