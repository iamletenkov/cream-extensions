# Черновик tools/convert-v1.py из layout 2 (firewall 1.2.0): отчёт конвертера — что
# проверить руками (план 2026-10-19-cream-v1-migration, «Порядок перевода одного расширения»).
schema: cream/v1
name: firewall
version: 2.0.0
summary: "Файрвол машины"
cream: ">=1.1.0"
platform:
  family: deb
  arch: [amd64, arm64]
targets:
  build: exec
  live: "confirm"
  live_note: "policy drop на входе: по SSH легко отрезать себя"
provides: [host-firewall]
hooks:
  install: {}
  configure: {stage: early}
  apply: {}
config:
  keys:
    FIREWALL_ENABLE:
      type: "bool"
      default: "1"
      description: "1 — правила применяются (входящее, кроме разрешённого, отбрасывается); 0 — таблица и цепочки снимаются, входящее не фильтруется"
    FIREWALL_BACKEND:
      type: "enum:auto,nft,iptables"
      default: "auto"
      description: "чем фильтровать: auto — nftables, если в ядре есть nf_tables и nft_ct, иначе iptables-legacy (цепочка BISQUITE-INPUT, файлы *.rules/*.rules6); nft, iptables — явно"
