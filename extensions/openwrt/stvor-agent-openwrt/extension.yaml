# stvor-agent-openwrt — stvor-agent on OpenWrt 25.12+ (spec cream 2026-10-20-openwrt
# §4.2, §4.3): the twin of debian/stvor-agent with the delivery of the agent for
# OpenWrt — stvor-agent_<v>_linux_<arch>.tar.gz (the static binary and the procd
# init scripts init.d/stvor-agent{,-telemetry,-apply} of the agent's own repository) by
# version and sha256. Keys are those of debian/stvor-agent (the contract with the
# install script of Stvor), STVOR_AGENT_TARBALL instead of STVOR_AGENT_DEB.
#
# install   — tar.gz → sha256 → /usr/bin/stvor-agent, /etc/init.d/stvor-agent{,-telemetry}
#             (enabled; they start only with their token), /etc/init.d/stvor-agent-apply
#             when the release has it (agent >= 4.4.0; never enabled here — the
#             agent enables it for an attempt of the applier), /etc/init.d/stvor-agent-connect
#             when the release has it (agent >= 5.6.0; never enabled here — `stvor-agent
#             connect` enables it, an rc.d link already there stays), the user and group
#             stvor-telemetry (user_add/group_add_next of /lib/functions.sh), the
#             state /opt/stvor-agent (0750 root:stvor-telemetry); on a live machine —
#             reload-apps of teleport-openwrt for the label stvor_agent.
# configure — every boot (stage system, before procd starts the services; as
#             install): owners and modes of the state — /opt/stvor-agent,
#             machine-id, state.json, the tokens and their directories, the
#             telemetry tree of stvor-telemetry. No network.
# apply     — running services restart in the background.
# remove    — the connect service stopped, stvor-agent disable, services off, the binary, the init scripts,
#             tokens, the state and the user (if this extension made it) gone;
#             refused while the applier runs or is enabled (an attempt).
# files     — the drop-in of the command label stvor_agent of teleport-openwrt,
#             /lib/upgrade/keep.d/stvor-agent (sysupgrade keeps the agent whole:
#             machine-id, state, tokens, domain, last-good.json — Р4 revised 2026-10-23).
schema: cream/v1
name: stvor-agent-openwrt
version: 1.6.1
# 1.6.1: пин tar.gz stvor-agent 5.6.0.
# 1.6.0: init.d/stvor-agent-connect из tar.gz (агент >= 5.6.0; служба подключения одной командой,
#        procd): ставится обычным файлом, не включается и не запускается, ссылка в rc.d не
#        трогается; remove останавливает её до stvor-agent disable, выключает и стирает.
# 1.5.2: пин tar.gz stvor-agent 5.5.1.
# 1.5.1: пин tar.gz stvor-agent 5.5.0.
# 1.5.0: пин tar.gz stvor-agent 5.4.0; ключ STVOR_AGENT_NEIGHBORS_OFF, как у debian/stvor-agent.
# 1.4.4: пин tar.gz stvor-agent 5.3.1.
# 1.4.3: пин tar.gz stvor-agent 5.3.0.
# 1.4.2: пин tar.gz stvor-agent 5.2.1.
# 1.4.1: пин tar.gz stvor-agent 5.2.0.
# 1.4.0: STVOR_AGENT_AUTH_FILE — как у debian/stvor-agent 4.4.0: ключ закрытого /dist файлом
#        заголовка, только к https-зеркалу и https-редиректу.
# 1.3.5: пин tar.gz stvor-agent 5.1.0.
# 1.3.4: пин tar.gz stvor-agent 5.0.0.
# 1.3.3: keep.d хранит и ключ робота агента v2 (robot.key, robot.key.next), ca.pem и
#        roots.pem /etc/stvor-agent: после sysupgrade робот тот же, без нового enroll;
#        install и configure возвращают ключам 0600 root, roots.pem — 0644 root.
# 1.3.2: пин tar.gz stvor-agent 4.4.0.
# 1.3.1: обрыв на LTE — curl tar.gz с --retry-all-errors (обрыв потока HTTP/2, 429 с
#        Retry-After).
# 1.3.0: init.d/stvor-agent-apply из tar.gz (агент >= 4.4.0; не включается, не перезапускается),
#        keep.d хранит /opt/stvor-agent/last-good.json, remove — отказ, пока применитель работает или включён.
# 1.2.1: пин tar.gz stvor-agent 4.3.1.
# 1.2.0: пин поставленного tar.gz — /opt/cream/var/ext/stvor-agent-openwrt/installed-pin
#        (STVOR_AGENT_VERSION=, STVOR_AGENT_SHA256=; 0600, атомарно), keep.d хранит его:
#        /etc/stvor/restore.sh Stvor ставит агента по нему. Снимается до скачивания.
# 1.1.4: пин tar.gz stvor-agent 4.3.0.
# 1.1.3: пин tar.gz stvor-agent 4.2.0.
# 1.1.2: keep.d — machine-id, state.json, telemetry-token.src, оба токена, домен и маркер
#        пользователя: после sysupgrade агент тот же; install и configure чинят права токенов.
# 1.1.1: keep.d — только machine-id; install и configure (каждая загрузка) выставляют
#        владельца и права состояния, буфер телеметрии после восстановления не 0:0.
# 1.1.0: пин tar.gz stvor-agent 4.1.0; действие status — здоровье с блоком telemetry.
summary: Агент портала Stvor на OpenWrt — метки env и space узла Teleport с портала и телеметрия, procd
cream: ">=1.3.0"
platform:
  family: openwrt
  arch: [amd64, arm64]
  os: [{id: openwrt, version: ">=25.12"}]
  commands: [bash, tar, sha256sum]
targets: {build: exec, live: "yes"}
provides: [stvor-agent]
# Major of teleport-openwrt is the version of the managed labels interface and
# of the command-labels.d contract (as for debian/stvor-agent and teleport).
depends: [{name: teleport-openwrt, version: ">=1.0.0 <2"}]
hooks:
  install: {timeout: 10m}
  upgrade: {timeout: 10m}
  configure: {stage: system, every_boot: true, timeout: 1m}
  remove: {}
  apply: {}
# Health (cream v1 reserves the check hook) — as debian/stvor-agent.
actions:
  status:
    summary: "здоровье агента и телеметрии: stvor-agent status --json с вердиктом, JSON"
    lock: none
    output: json
    phases: [live]
config:
  keys:
    STVOR_AGENT_VERSION:
      type: "re:^[0-9]+\\.[0-9]+\\.[0-9]+$"
      default: ""
      empty: true
      scope: install
      description: "версия агента; задаётся вместе с STVOR_AGENT_SHA256, пусто — пин каталога (files/pin.env)"
    STVOR_AGENT_SHA256:
      type: "re:^[0-9a-f]{64}$"
      default: ""
      empty: true
      scope: install
      description: "sha256 tar.gz архитектуры машины; задаётся вместе с STVOR_AGENT_VERSION"
    STVOR_AGENT_MIRROR:
      type: str
      default: ""
      empty: true
      scope: install
      description: "база зеркала, файл плоско <база>/stvor-agent_<версия>_linux_<arch>.tar.gz; пусто — релиз GitHub"
    STVOR_AGENT_TARBALL:
      type: path
      default: ""
      empty: true
      scope: install
      description: "локальный tar.gz (офлайн, абсолютный путь); взаимоисключим с STVOR_AGENT_MIRROR"
    STVOR_AGENT_AUTH_FILE:
      type: path
      default: ""
      empty: true
      scope: install
      description: "файл с ключом зеркала (sbk_ сборщика для закрытого /dist портала, секрет сборки): Authorization: Bearer только к https STVOR_AGENT_MIRROR, не в argv"
    STVOR_AGENT_INTERVAL:
      type: "re:^([6-9][0-9]|[1-5][0-9]{2}|600)$"
      default: "60"
      description: "период опроса портала, секунды, 60–600"
    STVOR_AGENT_LOG_LEVEL:
      type: "enum:info,debug"
      default: info
      description: "уровень журнала службы"
    STVOR_AGENT_NEIGHBORS_OFF:
      type: "re:^(mdns|lldp|wifi|all)(,(mdns|lldp|wifi|all))*$"
      default: ""
      empty: true
      description: "локальный запрет источников соседей (агент ≥ 5.4.0): mdns, lldp, wifi, all через запятую; стоит над политикой портала; пусто — по политике"
files:
  - {src: files/stvor_agent.command-label, dst: /etc/cream/teleport-openwrt/command-labels.d/stvor_agent, mode: "0644"}
  - {src: files/keep.d, dst: /lib/upgrade/keep.d/stvor-agent, mode: "0644"}
