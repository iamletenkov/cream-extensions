# l4t-tensorflow — TensorFlow with CUDA for NVIDIA Jetson (JetPack 6, L4T 36.4):
# the NVIDIA wheel by sha256, cuDNN from apt, keras and the rest of PyPI pinned
# by requirements.txt with hashes. The last TensorFlow NVIDIA publishes for Jetson (jp/v61).
#
# install — not a Jetson (no /etc/nv_tegra_release) — code 20 before apt
#           (ruling R11); pip only by hashes (requirements.txt), as root into
#           /usr/local, never with a home directory of root; what it put on is
#           recorded in /var/lib/cream/ext/l4t-tensorflow/{packages,pip}.
# remove  — its own pip distributions (never one another still needs, e.g.
#           numpy of l4t-pytorch, pip-owned.py) and apt packages (refuses when
#           apt would take anything else; cuDNN and pip stay while torch is
#           installed).
# No library: no R32 branch (no wheel for Python 3.8 / CUDA 10.2).
# Tree: requirements.txt, check-system-python.py, pip-owned.py.
schema: cream/v1
name: l4t-tensorflow
version: 2.1.1
# 2.1.1: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: TensorFlow с CUDA для NVIDIA Jetson — колесо NVIDIA 2.16.1, cuDNN 9 и keras 3.3.3
cream: ">=1.0.0"
platform:
  family: deb
  arch: [arm64]
targets: {build: exec, live: "yes"}
provides: [tensorflow]
# cuda: TF loads libcublas, libcufft, libcusolver and the rest of the toolkit.
# cuDNN and numpy 1.26 it installs itself — the same versions as l4t-pytorch,
# so the two do not argue (checked on a board: one numpy for both).
requires: [cuda]
depends:
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  # A 553 MB wheel plus ~1.9 GB of dependencies from the network.
  install: {timeout: 90m}
  remove: {timeout: 20m}
