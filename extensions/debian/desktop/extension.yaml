# desktop — the settings of a desktop shared by gnome, xfce4, lxde and
# cloud-user-desktop: autologin (gdm3, lightdm), no auto-lock, no blanking
# (dconf, X DPMS, xfconf, lxsession), the groups of the session user. One code
# for every display manager, so the desktop extensions cannot diverge.
#
# install   — dconf-cli and x11-xserver-utils (dconf update, xset); applies
#             nothing: configure does.
# configure — every boot, stage system BEFORE the display manager (plan ruling
#             R5): the autologin user is in group video before Xorg of the
#             session opens the GPU, and gdm/lightdm read the autologin already
#             written. Not stage graphical: that one is After=display-manager.
#             After cloud-init.service (it creates the user), NOT cloud-final
#             (After=multi-user — a cycle that made systemd drop gdm twice).
#             On a working machine (install, `cream set desktop …`) it also
#             restarts the display manager when the autologin changed and no
#             graphical session is open.
# upgrade   — instead of install on `cream upgrade`: the packages of install;
#             from 1.x — the marker legacy in the record of the autologin.
# remove    — takes away the dconf, X and xfconf files; the autologin goes back
#             to the record of install (legacy or none — off); the groups stay.
# Actions   — apply (now or as at boot), status, defaults (write without applying).
#
# 1.1.0: hooks.configure.every_boot — configure runs every boot (cream 1.2.0
#        otherwise skips it by the configure mark; audit 2026-10-21).
schema: cream/v1
name: desktop
version: 2.0.1
# 2.0.0: DESKTOP_AUTOLOGIN пусто по умолчанию — автологином не управляю; прежние
#        строки автологина записываются при install и возвращаются при пустом
#        ключе и remove; хук upgrade (маркер legacy с 1.x); SDDM + 0/1 — отказ
#        (спека 2026-11-12-existing-desktop §4.3, Р1).
# 1.1.1: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
# 1.0.1: только README (выпуск 5.1.1 изменил дерево без подъёма версии —
#        cream отвергал обновление с 1.0.0: version.same_digest).
summary: Ручки рабочего стола — автологин gdm3/lightdm, без автоблокировки и затемнения, группы пользователя
cream: ">=1.2.0"
platform:
  family: deb
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
targets:
  build: exec
  live: "yes"
depends:
  - {name: cloud-user, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 10m}
  # 30 s of waiting for the cloud-init user at boot, then the rest is files.
  configure:
    stage: system
    every_boot: true
    after: [cloud-init.service, guestfs-firstboot.service]
    before: [display-manager.service, gdm.service, gdm3.service, lightdm.service]
    timeout: 2m
  upgrade: {timeout: 10m}
  remove: {timeout: 2m}
config:
  keys:
    DESKTOP_AUTOLOGIN:
      type: bool
      default: ""
      empty: true
      description: "пусто — автологином не управляю; 0 — выключить; 1 — вход без пароля (gdm3, lightdm; SDDM — отказ)"
    DESKTOP_AUTOLOGIN_USER:
      type: "re:^[a-z_][a-z0-9_-]{0,31}$"
      default: ""
      empty: true
      description: "пользователь автологина и групп сеанса; пусто — пользователь cloud-init (библиотека cloud-user)"
    DESKTOP_DISABLE_SCREEN_LOCK:
      type: bool
      default: "0"
      description: "1 — без автоблокировки экрана (заблокировать вручную можно)"
    DESKTOP_DISABLE_SCREEN_BLANK:
      type: bool
      default: "0"
      description: "1 — без затемнения, гашения, DPMS и сна"
actions:
  apply:
    summary: "применить ручки сейчас (--now, умолчание) или как на загрузке (--boot)"
    args: free
    lock: exclusive
    phases: [live]
  status:
    summary: "ручки и что из них применено"
    lock: none
    phases: [live]
  defaults:
    summary: "записать ручки, не применяя (cream set --no-apply desktop …)"
    args: pairs
    params:
      DESKTOP_AUTOLOGIN: {}
      DESKTOP_AUTOLOGIN_USER: {}
      DESKTOP_DISABLE_SCREEN_LOCK: {}
      DESKTOP_DISABLE_SCREEN_BLANK: {}
    lock: exclusive
    phases: [build, live]
