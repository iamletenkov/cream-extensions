# l4t-opencv — OpenCV 4.8.0 for NVIDIA Jetson from the NVIDIA repository
# (cv2 with GStreamer, FFmpeg and V4L2, without CUDA). On L4T R32 (Jetson Nano)
# nothing is installed: cv2 of the base image is checked and
# OPENBLAS_CORETYPE=ARMV8 is pinned for logins and services (library l4t).
#
# install — not a Jetson (no /etc/nv_tegra_release) — code 20 before apt
#           (ruling R11); the branch comes from l4t_major of the library l4t;
#           the packages it put on go to /var/lib/cream/ext/l4t-opencv/packages.
# remove  — its own packages (never those there before cream; refuses when apt
#           would take anything else with them) and the OPENBLAS_CORETYPE pin of
#           R32 while no other extension's drop-in needs it.
# No configure: nothing to finish on boot. The GStreamer backend of cv2 works
# on bare libgstreamer; the hardware camera path (nvvidconv) is l4t-gstreamer,
# not a requirement.
schema: cream/v1
name: l4t-opencv
version: 2.0.2
# 2.0.2: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: OpenCV 4.8.0 для NVIDIA Jetson (cv2 с GStreamer) — пакеты NVIDIA на R36, проверка образа на R32
cream: ">=1.0.0"
platform:
  family: deb
  # The NVIDIA OpenCV packages live only in jetson/common (an L4T image).
  arch: [arm64]
targets: {build: exec, live: "yes"}
provides: [opencv]
depends:
  - {name: l4t, version: ">=1.0.0 <2"}
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 30m}
  remove: {timeout: 15m}
