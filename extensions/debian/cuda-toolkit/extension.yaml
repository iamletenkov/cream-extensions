# cuda-toolkit — CUDA Toolkit (nvcc and libraries) on NVIDIA Jetson from the
# jetson/common repository the L4T BSP already put on (nvidia-l4t-apt-source),
# plus a system profile with PATH/LD_LIBRARY_PATH.
#
# install — not a Jetson (no /etc/nv_tegra_release) — code 20 before apt
#           (ruling R11); otherwise apt, the profile, and the packages it put on
#           recorded in /var/lib/cream/ext/cuda-toolkit/packages.
# remove  — its own packages (never one that was there before cream) and the
#           profile; refuses when apt would take anything else with them.
# R32 (Jetson Nano): CUDA 10.2 — `cuda-toolkit-10-2`, or nothing when the
#           vendor image already has /usr/local/cuda-10.2; without an active
#           jetson/common line — its own source r32.<revision> signed by the
#           NVIDIA key from files/ (sha256-pinned in the hook).
# No configure: nothing to finish on boot. No library: the release line is
# parsed in the hook (major and revision), nothing else is shared.
schema: cream/v1
name: cuda-toolkit
version: 2.1.0
summary: CUDA Toolkit для NVIDIA Jetson из репозитория jetson/common и системный профиль PATH
cream: ">=1.0.0"
platform:
  family: deb
  # arm64 only: jetson/common exists only in an L4T image. amd64 CUDA comes
  # from other sources (cuda-repo-*) and shares no code with this extension.
  arch: [arm64]
targets: {build: exec, live: "yes"}
provides: [cuda]
depends:
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  # The toolkit is a few gigabytes from the network.
  install: {timeout: 60m}
  remove: {timeout: 15m}
