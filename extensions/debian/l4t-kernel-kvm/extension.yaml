# l4t-kernel-kvm — builds the L4T kernel of a Jetson Nano/TX1 (t210) with KVM,
# installs it as /boot/Image.kvm with all patched device trees
# (/boot/<name>-kvm.dtb) and makes the `kvm` entry of extlinux.conf the
# default; root= of every entry is rewritten to root=PARTUUID.
#
# install — the only hook; about three hours on a Nano, hence the explicit
#           timeout. Codes: 10 — done, reboot to the new kernel; 20 — not L4T
#           (ruling R11); 1 — refusals, all before apt and the download.
#           extlinux.conf.cream-orig — the file before the first change made by
#           cream, taken once (spec cream §6.3); extlinux-root.sh — the helpers
#           of extlinux.conf, sourced from the extension tree.
# No configure, no remove: the kernel belongs to the base image (live: no);
# `cream remove --forget` drops the record (README).
#
# 2.0.0: cream/v1; backup .cream-orig once instead of .before-kvm on every
#        run; extlinux.conf written through rename; keys typed (scope install).
# 1.4.0: CONFIG_SQUASHFS_LZO=y — снапы с lzo монтируются, snapd не крутит обновление.
# 1.3.0: root=PARTUUID во всех записях extlinux, проверки до сборки ядра.
# 1.2.0: L4T_KERNEL_JOBS ограничен ядрами и памятью appliance, урезание вслух.
schema: cream/v1
name: l4t-kernel-kvm
version: 2.0.0
summary: Ядро L4T с KVM для Jetson Nano/TX1 (t210) — сборка из исходников NVIDIA, загрузка по умолчанию
cream: ">=1.0.0"
platform:
  family: deb
  # L4T exists only on Tegra, and Tegra is only arm64; the hook narrows it to t210.
  arch: [arm64]
  commands: [python3]
targets:
  build: exec
  live: "no"
  live_note: >-
    около трёх часов сборки ядра и 11 ГБ исходников, меняет ядро по умолчанию
    (DEFAULT kvm) и root= всех записей extlinux.conf — место ему в базовом
    образе (bisquite, FROM), а не на работающей плате
provides: [kvm-host, l4t-custom-kernel]
hooks:
  # ~3 h on a Nano at -j2 plus apt and 160 MB of sources; explicit, >= 4 h.
  install: {timeout: 6h}
config:
  keys:
    L4T_KERNEL_JOBS:
      type: "re:^[1-9][0-9]{0,2}$"
      default: "2"
      scope: install
      description: "заданий make; урезается до ядер и памяти appliance (1,5 ГБ на задание)"
    L4T_KERNEL_LOCALVERSION:
      type: "re:^-[a-z0-9][a-z0-9._-]{0,31}$"
      default: "-tegra-kvm"
      scope: install
      description: "суффикс версии ядра (uname -r)"
    L4T_KERNEL_CC:
      type: "re:^[a-z][a-z0-9.+_-]{0,31}$"
      default: "gcc-8"
      scope: install
      description: "компилятор; gcc-8 — единственный, которым ядро собрано целиком и проверено на плате"
    L4T_KERNEL_FDT:
      type: "re:^[a-z0-9][a-z0-9._-]{0,127}$"
      default: ""
      empty: true
      scope: install
      description: "плата для строки FDT записи kvm (имя дерева без -kvm); пусто — из текущей FDT или без строки"
    L4T_KERNEL_KEEP_SOURCES:
      type: "enum:yes,no"
      default: "no"
      scope: install
      description: "yes — оставить исходники в /usr/src/l4t-kernel-kvm (около 11 ГБ)"
