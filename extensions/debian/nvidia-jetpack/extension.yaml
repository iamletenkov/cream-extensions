# nvidia-jetpack — a flashing station for NVIDIA Jetson boards. The station is
# an ordinary amd64 PC with a USB port, not the board: the whole L4T toolchain
# (flash.sh, tools/kernel_flash/*.sh, tegraflash.py) runs on x86_64 and enters
# the arm64 rootfs through qemu-user-static. jetson-stats is the opposite (it
# goes on the board, arm64) — do not mix them up.
#
# install — the L4T flashing toolchain (only the missing packages; the record in
#           $CREAM_STATE_DIR/packages), nfs-server enabled (not started), the
#           aarch64 binfmt file; on a live machine with systemd (not in a
#           container) systemd-binfmt is restarted when that file changed.
# remove  — our binfmt file and our packages; the operator's data stays.
# files   — the udev rule against USB autosuspend (by vendor 0955).
# No configure: nothing depends on the particular machine. The station scripts
# stay in the tree, /opt/cream/ext/nvidia-jetpack/scripts/, and run by hand only.
# files/qemu-aarch64.conf is the binfmt template the hooks copy and compare —
# not a `files` entry: it is written only when the emulator is there.
#
# 3.1.0: step 04 takes the password from a 0600 file or stdin (-P), never argv;
#        step 09 builds into a root-only stage and the operator moves the
#        results into OUT_DIR (no chown -R).
# 3.0.0: cream/v1; scripts in /opt/cream/ext/nvidia-jetpack/scripts/ instead of
#        /opt/nvidia-jetpack/; live install with --accept-risk.
# 2.0.0: камеры ушли из базового образа в расширение sensing-gmsl2-camera.
schema: cream/v1
name: nvidia-jetpack
version: 3.1.0
summary: Станция прошивки NVIDIA Jetson на amd64 — инструментарий L4T, NFS, binfmt aarch64, скрипты
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64]
  os: [{id: ubuntu}, {id: debian}]
targets:
  build: exec
  live: confirm
  live_note: >-
    превращает машину в станцию прошивки Jetson: ставит около двадцати пакетов
    инструментария L4T (в том числе NFS-сервер nfs-kernel-server — он включается
    и поднимется на загрузке), кладёт /etc/binfmt.d/qemu-aarch64.conf и
    перезапускает systemd-binfmt (обработчики binfmt снимаются и ставятся заново),
    добавляет udev-правило против USB autosuspend для устройств NVIDIA;
    сама прошивка платы не запускается — только оператором по README
provides: [jetson-flash-station]
depends:
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 30m}
  remove: {timeout: 15m}
files:
  - {src: files/99-jetson-usb.rules, dst: /etc/udev/rules.d/99-jetson-usb.rules, mode: "0644"}
