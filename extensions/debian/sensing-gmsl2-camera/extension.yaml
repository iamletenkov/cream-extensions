# sensing-gmsl2-camera — Sensing GMSL2 cameras on Jetson AGX Orin with the
# SG8A-AGON-G2Y-A1 adapter on L4T 36.4.3: libnvisppg.so of NVIDIA's camera
# overlay (dpkg-divert), the Sensing kernel and modules, the DTB overlay, a boot
# entry with it, the L4T kernel packages held, and the cameras brought up on
# every boot (GMSL link mode, camera profile, SoC clocks).
#
# install — not a Jetson (no /etc/nv_tegra_release) — code 20; another board
#           or release — 1, both before the network; what it replaces is kept
#           in /var/lib/cream/ext/sensing-gmsl2-camera (originals of modules and
#           extlinux.conf, holds, overlays) for `remove`; something changed on
#           the boot path — code 10 (reboot), a repeat — 0.
# apply   — after `cream set`: restarts the camera profile and the clocks.
# remove  — puts the stock kernel, modules, extlinux.conf and libnvisppg.so
#           back and releases its holds (never one held before cream or by
#           another extension); refuses before any change while can-usb modules
#           are built for the Sensing kernel or extlinux.conf was edited since.
# The CLI of layout 2 is the actions camera-profile and boost-clock; the units
# and the udev rule are `files` and call them by absolute path (ruling R7).
schema: cream/v1
name: sensing-gmsl2-camera
version: 5.0.2
# 5.0.2: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: Камеры Sensing GMSL2 на Jetson AGX Orin (SG8A-AGON-G2Y-A1, L4T 36.4.3) — ядро, модули, оверлей, запуск на загрузке
cream: ">=1.0.0"
platform:
  family: deb
  arch: [arm64]
targets:
  build: exec
  live: confirm
  live_note: >-
    заменяет ядро платы (/boot/Image — ядро Sensing, штатное — в Image.backup), модули
    камер и libnvisppg.so (dpkg-divert), добавляет загрузочную запись с оверлеем камер
    и делает её основной, закрепляет пакеты ядра L4T (apt-mark hold); камеры заработают
    после перезагрузки; откат — пункт backup загрузочного меню или cream remove
provides: [gmsl2-camera]
depends:
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 30m}
  apply: {}
  remove: {timeout: 10m}
files:
  - {src: files/sensing-gmsl2-camera@.service, dst: /etc/systemd/system/sensing-gmsl2-camera@.service, mode: "0644"}
  - {src: files/sensing-gmsl2-clock.service, dst: /etc/systemd/system/sensing-gmsl2-clock.service, mode: "0644"}
  - {src: files/99-sensing-gmsl2-camera.rules, dst: /etc/udev/rules.d/99-sensing-gmsl2-camera.rules, mode: "0644"}
config:
  keys:
    SENSING_GMSLMODE:
      type: "re:^[012](,[012]){7}$"
      default: "1,1,1,1,1,1,1,1"
      scope: install
      description: "режим линка на 8 портах через запятую: 0 — GMSL1, 1 — GMSL2 6 Гбит/с, 2 — GMSL2 3 Гбит/с; параметр модуля — действует после перезагрузки"
    SENSING_CAMERA_CONTROLS:
      type: "re:^[a-z_]+=[0-9a-fx]+(,[a-z_]+=[0-9a-fx]+)*$"
      default: "sensor_mode=1,trig_mode=0,trig_pin=0x00020007"
      description: "профиль камеры: контролы v4l2 имя=число через запятую; умолчание — пункт 3 меню вендора (SG2-AR0233-5200-G-Hxxx)"
    SENSING_BOOST_CLOCK:
      type: bool
      default: "1"
      description: "1 — частоты VI/ISP/NVCSI/EMC на максимум"
actions:
  camera-profile:
    summary: "поставить профиль камеры (SENSING_CAMERA_CONTROLS) на узел videoN; не Sensing — мимо"
    args: free
    lock: none
    phases: [live]
  boost-clock:
    summary: "частоты VI/ISP/NVCSI/EMC на максимум, если SENSING_BOOST_CLOCK=1"
    lock: none
    phases: [live]
