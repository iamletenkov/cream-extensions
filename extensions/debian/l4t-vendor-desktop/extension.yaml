# l4t-vendor-desktop — the desktop a vendor L4T R32 image already carries (Jetson
# Nano: Ubuntu with Xorg, gdm3/lightdm and GNOME/Unity/LXDE sessions) declared
# as the capabilities x11-server, display-manager and desktop-session, so that
# x11vnc, selkies, wallpaper and the rest resolve on it.
#
# WHY A SEPARATE EXTENSION, NOT `provides` IN gnome/lxde/xfce4. Those install
# and configure a desktop (packages, Wayland off, graphical.target); on a vendor
# Nano image the desktop is already there, its repositories are disabled, and
# reinstalling it from focal/bionic would replace what the vendor tuned. A
# "check only" mode inside gnome would be a second extension in one manifest.
# This one installs nothing and changes nothing: it checks that the three things
# are in the image and refuses loudly (1) when one is missing.
#
# install — not L4T R32 (no /etc/nv_tegra_release or another major) — 20: on
#           R36 and on plain Debian/Ubuntu a desktop extension installs it.
#           Otherwise Xorg, a display manager (display-manager.service or
#           /etc/X11/default-display-manager pointing at an existing binary)
#           and an X session in /usr/share/xsessions — or 1.
# remove  — nothing to take away: the desktop belongs to the image.
# Mutually exclusive with gnome, xfce4, lxde by capability (desktop-session).
schema: cream/v1
name: l4t-vendor-desktop
version: 1.0.0
summary: Рабочий стол образа вендора L4T R32 (Jetson Nano) как x11-server, display-manager, desktop-session
cream: ">=1.0.0"
platform:
  family: deb
  arch: [arm64]
  os: [{id: ubuntu, version: ">=18.04"}]
targets: {build: exec, live: "yes"}
provides: [x11-server, display-manager, desktop-session]
conflicts:
  capabilities: [desktop-session]
hooks:
  install: {timeout: 2m}
  remove: {}
