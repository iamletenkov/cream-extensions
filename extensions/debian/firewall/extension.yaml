# firewall — host firewall: our own nftables table `inet cream` (input policy
# drop) or, on kernels without nft_ct (stock L4T r36.4.3), our own
# iptables-legacy chain CREAM-INPUT (the first jump in INPUT). Docker is not
# touched: its chains (DOCKER, DOCKER-USER, FORWARD, nat) are never flushed,
# published ports go through forward, not input.
#
# install   — picks the backend for every kernel of the image (refuses a
#             kernel that can run neither), installs nftables and iptables,
#             lays down the default rules of both backends in
#             /etc/cream/firewall/rules.d/ (an edited copy is kept), checks them.
# configure — stage early (sysinit, before network-pre.target): every boot and
#             on `cream set` the table/chain is rebuilt in one transaction.
#             There is no apply hook: applying is a restart of configure (§8.4).
# remove    — takes down only our table and chain.
#
# 2.0.0: cream/v1 (was layout 2, 1.2.0): the table is now `inet cream`, the
# chain CREAM-INPUT, loaded rules of the old names are not migrated (owner's
# decision); the CLI -> actions status, reload, check; SSH stays closed by
# default (FIREWALL_SSH_PORTS empty: Teleport is a reverse tunnel).
#
# 2.1.0: hooks.configure.every_boot — configure runs every boot (cream 1.2.0
#        otherwise skips it by the configure mark; audit 2026-10-21).
schema: cream/v1
name: firewall
version: 2.1.0
# 2.0.1: только README (выпуск 5.1.1 изменил дерево без подъёма версии —
#        cream отвергал обновление с 2.0.0: version.same_digest).
summary: Файрвол машины — своя таблица nftables inet cream или цепочка iptables-legacy CREAM-INPUT
cream: ">=1.2.0"
platform:
  family: deb
  # apt packages nftables and iptables and scripts: the architecture does not
  # matter. Checked: amd64 with the host kernel (nftables), arm64 with the
  # module lists of L4T r36.4.3 (iptables-legacy).
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
targets:
  build: exec
  live: confirm
  live_note: >-
    сразу после установки входящее закрыто (policy drop), кроме петли и ответов на
    исходящие соединения (обратный туннель Teleport работает); SSH по умолчанию
    закрыт — на живой машине, куда вы вошли по SSH, сначала
    cream set firewall FIREWALL_SSH_PORTS=22 (или установите с этим параметром),
    иначе сессия оборвётся; иные входящие службы открывает файл правил
    /etc/cream/firewall/rules.d; если включён nftables.service, его flush ruleset
    снимает и цепочки Docker
provides: [host-firewall]
hooks:
  install: {timeout: 15m}
  # Early: before network-pre.target, so there is no window with open input.
  # After nftables.service (if someone enables it): its /etc/nftables.conf runs
  # `flush ruleset`; our table must be built after it, not wiped by it.
  configure: {stage: early, after: [nftables.service], timeout: 2m, every_boot: true}
  remove: {timeout: 2m}
config:
  keys:
    FIREWALL_ENABLE:
      type: bool
      default: "1"
      description: "1 — правила применяются (входящее, кроме разрешённого, отбрасывается); 0 — таблица и цепочки снимаются, входящее не фильтруется"
    FIREWALL_BACKEND:
      type: "enum:auto,nft,iptables"
      default: auto
      description: "чем фильтровать: auto — nftables, если в ядре есть nf_tables и nft_ct, иначе iptables-legacy (цепочка CREAM-INPUT, файлы *.rules/*.rules6); nft, iptables — явно"
    FIREWALL_SSH_PORTS:
      type: "list:port"
      default: ""
      empty: true
      description: "порты TCP SSH через пробел — открыты и правилами, и запасным набором; пусто (умолчание) — SSH закрыт"
actions:
  status:
    summary: "бэкенд применённый и тот, что выберет apply; настройки; наша таблица и цепочки в ядре"
    lock: none
  check:
    summary: "проверить файлы rules.d выбранного бэкенда, ничего не применяя: 0 — верны, 3 — формат *.rules, 1 — отказ"
    lock: none
  reload:
    summary: "применить rules.d сейчас одной транзакцией; 1 — файлы не загрузились, стоит запасной набор"
    lock: exclusive
