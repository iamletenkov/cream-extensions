# tensorrt — TensorRT on NVIDIA Jetson: on L4T R36 the engine, the Python
# bindings and the DLA compiler from jetson/common (the repository the L4T BSP
# already put on); on L4T R32 (Jetson Nano) nothing is installed — the engine
# of the base image is checked.
#
# install — not a Jetson (no /etc/nv_tegra_release) — code 20 before apt
#           (ruling R11); the branch comes from l4t_major of the library l4t;
#           the packages it put on go to /var/lib/cream/ext/tensorrt/packages.
# remove  — its own packages (never those there before cream); refuses when apt
#           would take anything else with them.
# No configure: nothing to finish on boot.
schema: cream/v1
name: tensorrt
version: 2.0.2
# 2.0.2: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: TensorRT для NVIDIA Jetson — движок, биндинги Python и компилятор DLA (R36), проверка движка образа (R32)
cream: ">=1.0.0"
platform:
  family: deb
  # The packages live only in jetson/common, connected only in an L4T image.
  arch: [arm64]
targets: {build: exec, live: "yes"}
provides: [tensorrt]
# TensorRT needs the CUDA runtime (nvidia-l4t-cuda, always in the base image),
# not cuda-toolkit: apt pulls the libraries as package dependencies.
depends:
  - {name: l4t, version: ">=1.0.0 <2"}
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 30m}
  remove: {timeout: 15m}
