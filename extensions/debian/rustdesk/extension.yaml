# rustdesk — the RustDesk client and its service (rustdesk --service, root),
# with the addresses of an own RustDesk server rendered from the domain keys.
#
# install   — the .deb of the GitHub release by version and sha256 (checked
#             before apt), rustdesk.service laid out (postinst does it only
#             under systemd) and enabled; in the BUILD the device identity
#             (RustDesk*.toml) is removed from the image — each device makes
#             its own; a live install never touches it.
# configure — stage system, before rustdesk.service, after cloud-init (it
#             creates the users): every boot and after `cream set rustdesk …`
#             renders the server keys into RustDesk2.toml of root and of every
#             user — the users' files as the users (runuser), never as root.
#             State: /var/lib/cream/ext/rustdesk/managed (the options we wrote).
# remove    — our options away, our package and unit away.
# Nothing sets a password or an access mode: access is RustDesk's default — a
# one-time password shown on the screen. RUSTDESK_KEY is the server's PUBLIC key.
#
# 2.0.0: cream/v1; configure-rustdesk.service → stage system; the domain is
#        /etc/cream/rustdesk; the identity is wiped in the build only; the
#        follow-up re-render restarts cream-configure@rustdesk.
# 2.1.0: hooks.configure.every_boot — configure runs every boot (cream 1.2.0
#        otherwise skips it by the configure mark; audit 2026-10-21); the
#        follow-up re-render is `cream configure --again rustdesk` 30 s later.
schema: cream/v1
name: rustdesk
version: 2.1.1
# 2.1.1: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: RustDesk — клиент и служба удалённой поддержки, адреса своего сервера из ключей домена
cream: ">=1.2.0"
platform:
  family: deb
  # One release asset per architecture with its own pinned sum; armhf (the
  # Sciter client) is another program and was never checked.
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
  commands: [curl, sha256sum]
targets: {build: exec, live: "yes"}
provides: [remote-support]
depends:
  - {name: cloud-user, version: ">=1.0.0 <2"}
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 20m}
  configure:
    stage: system
    every_boot: true
    after: [cloud-init.service, cloud-init-network.service, systemd-user-sessions.service]
    before: [rustdesk.service]
    timeout: 3m
  remove: {timeout: 10m}
config:
  keys:
    RUSTDESK_VERSION:
      type: "re:^[0-9]{1,4}\\.[0-9]{1,4}\\.[0-9]{1,4}$"
      default: "1.5.0"
      scope: install
      description: "тег релиза github.com/rustdesk/rustdesk; для версии без закреплённой суммы нужен RUSTDESK_SHA256*"
    RUSTDESK_SHA256_AMD64:
      type: "re:^[0-9a-f]{64}$"
      default: ""
      empty: true
      scope: install
      description: "sha256 rustdesk-<версия>-x86_64.deb; перекрывает RUSTDESK_SHA256"
    RUSTDESK_SHA256_ARM64:
      type: "re:^[0-9a-f]{64}$"
      default: ""
      empty: true
      scope: install
      description: "sha256 rustdesk-<версия>-aarch64.deb; перекрывает RUSTDESK_SHA256"
    RUSTDESK_SHA256:
      type: "re:^[0-9a-f]{64}$"
      default: ""
      empty: true
      scope: install
      description: "sha256 пакета для архитектуры машины"
    RUSTDESK_URL:
      type: "re:^https?://[A-Za-z0-9.:/_~%+-]+$"
      default: ""
      empty: true
      scope: install
      description: "полный адрес .deb (зеркало); пусто — ассет релиза GitHub"
    RUSTDESK_ID_SERVER:
      type: "re:^[A-Za-z0-9.-]{1,253}(:[0-9]{1,5})?$"
      default: ""
      empty: true
      description: "ID-сервер (custom-rendezvous-server): хост[:порт]"
    RUSTDESK_RELAY_SERVER:
      type: "re:^[A-Za-z0-9.-]{1,253}(:[0-9]{1,5})?$"
      default: ""
      empty: true
      description: "relay-сервер (relay-server): хост[:порт]"
    RUSTDESK_API_SERVER:
      type: "re:^https?://[A-Za-z0-9.-]{1,253}(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$"
      default: ""
      empty: true
      description: "API-сервер (api-server): URL"
    RUSTDESK_KEY:
      type: "re:^[A-Za-z0-9+/]{1,512}={0,2}$"
      default: ""
      empty: true
      description: "ПУБЛИЧНЫЙ ключ сервера (key, base64 из id_ed25519.pub сервера) — не секрет"
