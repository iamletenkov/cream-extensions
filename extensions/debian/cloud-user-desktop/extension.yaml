# cloud-user-desktop — for a VENDOR desktop (one that came with the base image,
# not with the gnome/xfce4/lxde extensions: Jetson Nano by Q-engineering,
# Raspberry Pi OS): takes away the vendor account with its well-known password
# and brings the desktop settings (extension desktop, depends), so that the
# autologin and the session groups go to the cloud-init user.
#
# install — removes the vendor account named in CLOUD_USER_DESKTOP_REMOVE with
#           its home directory: at BUILD, not at first boot — otherwise the
#           image carries a known password until then. Only a regular account
#           (uid >= 1000) by a name of the right form; an account that survives
#           userdel fails the hook. Empty key — nothing to do. Then the
#           autologin of gdm3 and LightDM that names the removed account is
#           taken away (6.0.0; desktop 1.x did it by its default
#           DESKTOP_AUTOLOGIN=0, desktop 2.x leaves it alone); another
#           account's autologin is not touched.
# remove  — nothing to give back: a removed account is not restored.
# No service of its own: the groups and the autologin of the cloud-init user
# are the configure of desktop (every boot, before the display manager).
#
# 5.0.0: cream/v1; the shared desktop code of layout 2 → extension desktop
#        (depends).
schema: cream/v1
name: cloud-user-desktop
version: 6.0.0
# 6.0.0: targets.live: confirm — userdel -r необратим (cream upgrade --all — только с
#        --accept-risk cloud-user-desktop или после cream hold); install снимает автологин
#        gdm3 и LightDM, указывающий на удалённую учётку (раньше — умолчание desktop 1.x);
#        диапазон desktop <3 (desktop 2.0.0).
# 5.0.1: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: Вендорский рабочий стол — удаление вендорской учётки и ручки desktop для пользователя cloud-init
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
targets:
  build: exec
  live: confirm
  live_note: >-
    удаляет вендорскую учётку CLOUD_USER_DESKTOP_REMOVE вместе с домашним каталогом
    (userdel -r — необратимо: учётка и её файлы не восстанавливаются) и снимает автологин
    gdm3 и LightDM, указывающий на неё; автологин другой учётки не трогается
provides: [cloud-user-desktop]
depends:
  - {name: desktop, version: ">=1.0.0 <3"}
  - {name: cloud-user, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 2m}
  remove: {timeout: 1m}
config:
  keys:
    CLOUD_USER_DESKTOP_REMOVE:
      type: "re:^[a-z_][a-z0-9_-]{0,31}$"
      default: ""
      empty: true
      scope: install
      description: "вендорская учётка, которую удалить вместе с домашним каталогом (только uid >= 1000); пусто — ничего"
