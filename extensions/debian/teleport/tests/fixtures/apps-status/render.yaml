# Сгенерирован cream run teleport render из /etc/cream/teleport. Не править:
# перезаписывается на каждом старте teleport.service.
version: v3
teleport:
  nodename: "lab-1"
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO
  proxy_server: "teleport.example.org:443"
  join_params:
    token_name: "robot-lab-1"
    method: bound_keypair
ssh_service:
  enabled: yes
  listen_addr: 127.0.0.1:3022
  labels:
    "env": "prod"
    "site": "lab"
    "space": "sp-1"
  commands:
    - name: "os_logins"
      command: ["/opt/cream/ext/teleport/files/os-logins"]
      period: 5m0s
app_service:
  enabled: yes
  apps:
    - name: "code-server-lab-1"
      uri: "https://127.0.0.1:9002"
      public_addr: "code-server.lab-1.teleport.example.org"
      insecure_skip_verify: true
      rewrite:
        headers:
          - "Host: code-server.lab-1.teleport.example.org"
      labels:
        "env": "prod"
        "site": "lab"
        "space": "sp-1"
        "app": "code-server"
        "teleport.icon": "mcpVscode"
    - name: "web-lab-1"
      uri: "http://127.0.0.1:8080"
      public_addr: "web.lab-1.teleport.example.org"
      rewrite:
        headers:
          - "Host: web.lab-1.teleport.example.org"
      labels:
        "env": "prod"
        "site": "lab"
        "space": "sp-1"
        "app": "web"
        "teleport.icon": "grafana"
    - name: "jupyter-lab-1"
      uri: "http://[::1]:8888/lab"
      public_addr: "jupyter.lab-1.teleport.example.org"
      rewrite:
        headers:
          - "Host: jupyter.lab-1.teleport.example.org"
      labels:
        "env": "prod"
        "site": "lab"
        "space": "sp-1"
        "app": "jupyter"
auth_service:
  enabled: no
proxy_service:
  enabled: no
