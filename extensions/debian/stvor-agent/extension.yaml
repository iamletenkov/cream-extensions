# stvor-agent — wrapper of the stvor-agent package (spec stvor-agent §11): the
# hooks put the .deb on by version and sha256, cream lays down the drop-in of
# the command label `stvor_agent` into the directory of the `teleport`
# extension (ruling Р11 of cream: ownership by this extension's registry, the
# file goes away on `cream remove stvor-agent`).
schema: cream/v1
name: stvor-agent
version: 4.0.1
# 4.0.1: пин пакета stvor-agent 4.0.0.
summary: Агент портала Stvor — метки env и space узла Teleport с портала
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64, arm64]
  os: [{id: debian, version: ">=12"}, {id: ubuntu, version: ">=22.04"}]
  commands: [dpkg, sha256sum]
targets: {build: exec, live: "yes"}
provides: [stvor-agent]
# Major of `teleport` is the version of the managed labels interface and of
# the command-labels.d contract (spec stvor-agent §10.2).
depends: [{name: teleport, version: ">=4.0.0 <5"}]
hooks:
  install: {timeout: 10m}
  upgrade: {timeout: 10m}
  remove: {}
  apply: {}
config:
  keys:
    STVOR_AGENT_VERSION:
      type: "re:^[0-9]+\\.[0-9]+\\.[0-9]+$"
      default: ""
      empty: true
      scope: install
      description: "версия пакета агента; задаётся вместе с STVOR_AGENT_SHA256, пусто — пин каталога (files/pin.env)"
    STVOR_AGENT_SHA256:
      type: "re:^[0-9a-f]{64}$"
      default: ""
      empty: true
      scope: install
      description: "sha256 .deb архитектуры машины; задаётся вместе с STVOR_AGENT_VERSION"
    STVOR_AGENT_MIRROR:
      type: str
      default: ""
      empty: true
      scope: install
      description: "база зеркала, файл плоско <база>/stvor-agent_<версия>_<arch>.deb; пусто — релиз GitHub"
    STVOR_AGENT_DEB:
      type: path
      default: ""
      empty: true
      scope: install
      description: "локальный .deb (офлайн, абсолютный путь); взаимоисключим с STVOR_AGENT_MIRROR"
    STVOR_AGENT_INTERVAL:
      type: "re:^([6-9][0-9]|[1-5][0-9]{2}|600)$"
      default: "60"
      description: "период опроса портала, секунды, 60–600"
    STVOR_AGENT_LOG_LEVEL:
      type: "enum:info,debug"
      default: info
      description: "уровень журнала службы"
files:
  - {src: files/stvor_agent.command-label, dst: /etc/cream/teleport/command-labels.d/stvor_agent, mode: "0644"}
