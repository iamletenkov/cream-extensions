# stvor-agent — wrapper of the stvor-agent package (spec stvor-agent §11): the
# hooks put the .deb on by version and sha256, cream lays down the drop-in of
# the command label `stvor_agent` into the directory of the `teleport`
# extension (ruling Р11 of cream: ownership by this extension's registry, the
# file goes away on `cream remove stvor-agent`).
schema: cream/v1
name: stvor-agent
version: 4.3.1
# 4.3.1: пин пакета stvor-agent 5.1.0.
# 4.3.0: без depends teleport — скрипт установки портала (auth v2) ставит агент и
#        делает enroll до `cream install teleport`; drop-in метки cream кладёт и
#        без teleport (Р11), render teleport подхватит его при своей установке.
#        Метке по-прежнему нужен teleport >= 4.0.2 той же мажорной версии (README).
# 4.2.6: пин пакета stvor-agent 5.0.0.
# 4.2.5: пин пакета stvor-agent 4.4.0.
# 4.2.4: обрыв на LTE — curl пакета с --retry-all-errors (обрыв потока HTTP/2, 429 с
#        Retry-After), на curl 7.71+; curl 7.68 (Ubuntu 20.04) — --retry 5, как было.
# 4.2.3: пин пакета stvor-agent 4.3.1.
# 4.2.2: пин пакета stvor-agent 4.3.0.
# 4.2.1: пин пакета stvor-agent 4.2.0.
# 4.2.0: пин пакета stvor-agent 4.1.0 (служба телеметрии): remove останавливает оба
#        юнита и стирает каталоги телеметрии; действие status — здоровье с блоком telemetry.
# 4.1.3: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
# 4.1.2: пин пакета stvor-agent 4.0.1.
# 4.1.1: только README (выпуск 5.1.1 изменил дерево без подъёма версии —
#        cream отвергал обновление с 4.1.0: version.same_digest).
# 4.1.0: Ubuntu 20.04 (Jetson Nano, L4T R32): агент — статический Go, юнит
#        пакета (Type=exec, ProtectClock) требует systemd >= 245 — у focal 245.
# 4.0.2: метку stvor_agent применяет teleport 4.0.2 (reload-apps), хуки больше не
#        запускают teleport-apps.service; depends teleport >=4.0.2.
# 4.0.1: пин пакета stvor-agent 4.0.0.
summary: Агент портала Stvor — метки env и space узла Teleport с портала
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64, arm64]
  os: [{id: debian, version: ">=12"}, {id: ubuntu, version: ">=20.04"}]
  commands: [dpkg, sha256sum]
targets: {build: exec, live: "yes"}
provides: [stvor-agent]
# No depends on `teleport`: the portal's install script puts the agent on and
# enrolls it before `cream install teleport`. The command label still needs
# teleport >= 4.0.2 of the same major (managed labels interface, spec
# stvor-agent §10.2) — the catalog ships one; see README.
hooks:
  install: {timeout: 10m}
  upgrade: {timeout: 10m}
  remove: {}
  apply: {}
# Health (cream v1 reserves the check hook): the agent and its telemetry from
# `stvor-agent status --json`; 0 — healthy, 1 — not.
actions:
  status:
    summary: "здоровье агента и телеметрии: stvor-agent status --json с вердиктом, JSON"
    lock: none
    output: json
    phases: [live]
config:
  keys:
    STVOR_AGENT_VERSION:
      type: "re:^[0-9]+\\.[0-9]+\\.[0-9]+$"
      default: ""
      empty: true
      scope: install
      description: "версия пакета агента; задаётся вместе с STVOR_AGENT_SHA256, пусто — пин каталога (files/pin.env)"
    STVOR_AGENT_SHA256:
      type: "re:^[0-9a-f]{64}$"
      default: ""
      empty: true
      scope: install
      description: "sha256 .deb архитектуры машины; задаётся вместе с STVOR_AGENT_VERSION"
    STVOR_AGENT_MIRROR:
      type: str
      default: ""
      empty: true
      scope: install
      description: "база зеркала, файл плоско <база>/stvor-agent_<версия>_<arch>.deb; пусто — релиз GitHub"
    STVOR_AGENT_DEB:
      type: path
      default: ""
      empty: true
      scope: install
      description: "локальный .deb (офлайн, абсолютный путь); взаимоисключим с STVOR_AGENT_MIRROR"
    STVOR_AGENT_INTERVAL:
      type: "re:^([6-9][0-9]|[1-5][0-9]{2}|600)$"
      default: "60"
      description: "период опроса портала, секунды, 60–600"
    STVOR_AGENT_LOG_LEVEL:
      type: "enum:info,debug"
      default: info
      description: "уровень журнала службы"
files:
  - {src: files/stvor_agent.command-label, dst: /etc/cream/teleport/command-labels.d/stvor_agent, mode: "0644"}
