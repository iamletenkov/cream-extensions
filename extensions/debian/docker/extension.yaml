# docker — Docker CE from Docker's own apt repository (download.docker.com).
# One path, not two: get.docker.com installs from the same repository (README,
# "Почему один путь, а не два"); the five package names are the same on every
# Debian/Ubuntu target, the branches are hardware traits (Pi, Jetson).
#
# install   — removes the competing packages (docker.io & co.), adds the
#             repository (deb822) and installs the five packages; on Jetson the
#             NVIDIA runtime (nvidia-container-toolkit + nvidia-ctk).
# configure — every boot, stage system after docker.service: the cloud-init
#             user joins group docker (the name is unknown at build time), on a
#             Raspberry Pi cgroup_enable=memory in cmdline.txt (code 10 — the
#             FAT partition is not mounted inside virt-customize), on Jetson a
#             restart of dockerd when daemon.json changed.
# files     — the iptables-raw check before each dockerd start and its drop-in.
#
# 4.1.0: hooks.configure.every_boot — configure runs every boot (cream 1.2.0
#        otherwise skips it by the configure mark; audit 2026-10-21).
schema: cream/v1
name: docker
version: 4.1.1
# 4.1.1: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
# 4.0.2: только README (выпуск 5.1.1 изменил дерево без подъёма версии —
#        cream отвергал обновление с 4.0.1: version.same_digest).
summary: Docker CE из официального apt-репозитория Docker (download.docker.com)
cream: ">=1.2.0"
platform:
  family: deb
  # The repository publishes binary-amd64 and binary-arm64 for every target
  # suite; binary-armhf exists too, but the project does not build it.
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
targets:
  build: exec
  live: confirm
  live_note: >-
    снимает конкурирующие пакеты, если стоят: docker.io, docker-cli, docker-compose,
    docker-compose-v2, docker-doc, docker-buildx, podman-docker, containerd, runc —
    их контейнеры останавливаются, обратно remove их не ставит; пользователь cloud-init
    получает группу docker (равносильно root); на Raspberry Pi правит cmdline.txt
    (нужна перезагрузка); на Jetson перезапускает dockerd под среду выполнения NVIDIA
provides: [container-runtime]
depends:
  - {name: cloud-user, version: ">=1.0.0 <2"}
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 30m}
  # After docker.service: the group exists (postinst) and a restart for the
  # NVIDIA runtime sees the daemon. No After=cloud-final: stage system is wanted
  # by multi-user.target, and cloud-final is After=multi-user — a cycle (README).
  configure: {stage: system, after: [docker.service], timeout: 5m, every_boot: true}
  remove: {timeout: 15m}
files:
  - {src: files/docker-iptables-raw-check, dst: /usr/local/libexec/docker-iptables-raw-check, mode: "0755"}
  - {src: files/10-docker-iptables-raw.conf,
     dst: /etc/systemd/system/docker.service.d/10-docker-iptables-raw.conf, mode: "0644"}
