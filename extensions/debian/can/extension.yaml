# can — CAN bus on the machine: can-utils, iproute2, CAN kernel modules for the
# kernels installed in /lib/modules (not `uname -r`) and their autoload list
# /etc/modules-load.d/can.conf.
#
# install — the modules are checked for every kernel of the image (modinfo -k,
#           modules.builtin); on Ubuntu the missing ones come from
#           linux-modules-extra-<kernel>; no kernel at all (a container) — 20;
#           then hooks/apply writes the autoload list.
# apply   — after `cream set can CAN_MODULES_LOAD=…`: rewrites can.conf and, on
#           a running system, queues systemd-modules-load (--no-block).
# remove  — can.conf and can-utils if install put it on; kernels and their
#           module packages are never touched.
#
# Kernel modules checked on amd64 (linux-modules-extra Ubuntu 24.04,
# linux-image Debian 12) and on the L4T r36.4.3 kernel layout (5.15.148-tegra):
# there slcan/gs_usb/peak_usb are not built at all — a warning, not a refusal
# (README, "Jetson / L4T").
schema: cream/v1
name: can
version: 2.0.0
summary: Шина CAN — can-utils, модули ядра CAN для ядер машины и их автозагрузка
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
targets:
  build: exec
  live: "yes"
# can-bus — can, can_raw, can_dev, vcan, slcan, gs_usb, peak_usb for every
# kernel (on L4T: can, can_raw, can_dev, vcan and CAN_MODULES_LOAD), candump/cansend.
provides: [can-bus]
hooks:
  install: {timeout: 20m}
  apply: {}
  remove: {timeout: 5m}
config:
  keys:
    CAN_MODULES_LOAD:
      type: "re:^[a-z0-9_-]+( [a-z0-9_-]+)*$"
      default: "can can_raw vcan"
      empty: true
      description: "модули для автозагрузки через пробел; каждый проверяется для ядер машины; пусто — /etc/modules-load.d/can.conf удаляется"
