# firefox — Firefox from Mozilla's own APT repository (packages.mozilla.org):
# a real .deb, not the snap stub of Ubuntu 22.04+. The capability is a browser,
# not a desktop: the X server and the session come from gnome/xfce4/lxde.
schema: cream/v1
name: firefox
version: 2.0.0
summary: Firefox из APT-репозитория Mozilla — настоящий .deb, а не снап
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64, arm64]
targets: {build: exec, live: "yes"}
provides: [web-browser]
hooks:
  install: {timeout: 20m}
  remove: {timeout: 10m}
config:
  keys:
    FIREFOX_LANGPACK:
      type: "re:^[a-z]{2,3}(-[A-Za-z]{2,4})?$"
      default: ""
      empty: true
      scope: install
      description: "языковой пакет: ru → firefox-l10n-ru; пусто — без него"
