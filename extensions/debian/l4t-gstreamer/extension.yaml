# l4t-gstreamer — GStreamer for NVIDIA Jetson: the NVIDIA hardware plugins
# (nvv4l2*, nvvidconv, nvarguscamerasrc) pinned to the version of the L4T stack,
# plus the Ubuntu GStreamer a robot needs — cameras, RTSP server, WebRTC,
# recording, Python. On L4T R32 (Jetson Nano) nothing is installed — the
# plugins of the base image are checked.
#
# install — not a Jetson (no /etc/nv_tegra_release) — code 20 before apt
#           (ruling R11); the branch comes from l4t_major of the library l4t;
#           the packages it put on go to /var/lib/cream/ext/l4t-gstreamer/packages.
# remove  — its own packages (never those there before cream, never the L4T
#           stack); refuses when apt would take anything else with them.
# No configure: nothing to finish on boot. No desktop needed: display sinks are
# installed anyway and simply unused without X.
schema: cream/v1
name: l4t-gstreamer
version: 2.0.2
# 2.0.2: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: GStreamer для NVIDIA Jetson — аппаратные плагины NVIDIA по версии стека L4T, RTSP, WebRTC, Python
cream: ">=1.0.0"
platform:
  family: deb
  # The NVIDIA plugins live only in jetson/common, connected only in an L4T image.
  arch: [arm64]
targets: {build: exec, live: "yes"}
provides: [gstreamer, hw-video-codec]
depends:
  - {name: l4t, version: ">=1.0.0 <2"}
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 30m}
  remove: {timeout: 15m}
config:
  keys:
    GSTREAMER_DEV:
      type: "enum:0,1"
      default: "1"
      scope: install
      description: "1 — заголовки GStreamer и Jetson Multimedia API для сборки своих приложений; 0 — без них (робот в поле)"
