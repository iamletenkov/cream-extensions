# vino-vnc — vino, the VNC server of GNOME, inside the session of the
# cloud-init user; loopback only by default.
#
# install   — vino, dconf-cli, libglib2.0-bin, dbus.
# configure — every boot, stage system after cloud-init.service and BEFORE the
#             display manager (plan ruling R5): the settings are system dconf
#             databases with locks — /etc/dconf/db/vino-vnc and, for the
#             password (secret VINO_PASSWORD), vino-vnc-secret 0640
#             root:<personal group of the session user> (a shared group is a
#             failure); autostart /etc/xdg/autostart/vino-server.desktop only
#             with a password or VINO_ALLOW_NO_PASSWORD=1 (fail-closed);
#             nothing in the home directory.
#             No own apply: `cream set` restarts configure.
# remove    — databases, profile lines and autostart gone; vino only when ours.
# No conflict with x11vnc: both default to port 5900 and are told apart by a
# parameter (VINO_PORT, X11VNC_PORT), not by excluding each other.
schema: cream/v1
name: vino-vnc
version: 5.0.0
summary: VNC через vino (GNOME) в сессии пользователя cloud-init — настройки системным dconf, по умолчанию только петля
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
targets:
  build: exec
  live: "yes"
provides: [remote-desktop]
requires: [x11-server, display-manager]
depends:
  - {name: cloud-user, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 15m}
  configure:
    stage: system
    after: [cloud-init.service]
    before: [display-manager.service, gdm.service, gdm3.service, lightdm.service]
    timeout: 2m
  remove: {timeout: 10m}
config:
  keys:
    VINO_PORT:
      type: "re:^(5[0-9]{3}|[1-4][0-9]{4}|50000)$"
      default: "5900"
      description: "порт 5000–50000 (диапазон alternative-port схемы org.gnome.Vino)"
    VINO_LISTEN:
      type: "enum:localhost,all"
      default: localhost
      description: "localhost — только петля (доступ ssh-туннелем), all — все интерфейсы"
    VINO_ENCRYPTION:
      type: "enum:true,false"
      default: "false"
      description: "require-encryption"
    VINO_PASSWORD:
      type: str
      default: ""
      empty: true
      secret: file
      description: "пароль VNC (значимы первые 8 символов); пусто — vino выключен; задаётся только через stdin: cream set vino-vnc VINO_PASSWORD=-"
    VINO_ALLOW_NO_PASSWORD:
      type: bool
      default: "0"
      description: "1 — разрешить vino без аутентификации при пустом VINO_PASSWORD (предупреждение при каждом configure); 0 — без пароля vino выключен"
