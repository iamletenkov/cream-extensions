# pixelflux-tegra — hardware H.264/H.265 in Selkies on NVIDIA Jetson.
#
# Selkies 2.0.0 carries pixelflux with the Tegra backend; what the base image
# does not solve is the system libxcb under the session (selkies#396: the
# AppImage's own libxcb next to the L4T X/EGL drops the capture), plus a gbm
# shim on focal, plus a check on live hardware.
#
# install   — no /etc/nv_tegra_release or not arm64 → 20 (plan ruling R11);
#             selkies must be installed (/opt/selkies/current). Builds the gbm
#             shim when the system libgbm lacks gbm_bo_create_with_modifiers2
#             (gcc in /var/lib/cream/ext/pixelflux-tegra, temporary file and
#             rename), writes the drop-in selkies@.service.d/10-pixelflux-tegra.conf
#             with LD_PRELOAD, checks that the module imports with it and
#             carries the Tegra backend; a stamp of the AppImage prefix in the
#             state directory.
# configure — every boot, stage graphical (was verify-pixelflux-tegra.service):
#             the encoder node, the access of the session user (group video on
#             JetPack 4), pixelflux answers "tegra" for H.264. No node, another
#             backend, a stale stamp — a warning and exit 0 (R11). After
#             install/upgrade a running selkies@ is restarted (no-block) to get
#             the preload.
# remove    — the drop-in, the shim, the stamp.
#
# 3.0.0: cream/v1 (plan 2026-10-19, Task 27); rename table — README.md.
schema: cream/v1
name: pixelflux-tegra
version: 3.0.0
summary: Аппаратное кодирование Selkies на Jetson — подкладка libxcb, шим gbm, проверка бэкенда Tegra
cream: ">=1.1.0"
platform:
  family: deb
  # The encoder sits behind the vendor libnvv4l2.so, present only in L4T.
  arch: [arm64]
targets:
  build: exec
  live: "yes"
# No capability of its own: the desktop is selkies', this is its accelerator;
# hw-video-codec belongs to l4t-gstreamer.
provides: []
requires: [web-remote-desktop]
depends:
  - {name: cloud-user, version: ">=1.0.0 <2"}
# Both tune pixelflux inside the one AppImage of selkies.
conflicts:
  extensions: [pixelflux-v4l2m2m]
hooks:
  install: {timeout: 15m}
  configure:
    stage: graphical
    timeout: 2m
  remove: {timeout: 1m}
