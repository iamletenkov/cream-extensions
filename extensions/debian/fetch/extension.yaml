# fetch — library, DEPRECATED since catalog 5.5.0: fetch_verified now lives once
# in git (lib/fetch.sh) and the snapshot lays it into files/fetch.sh of every
# consumer (lib/fetch.consumers) — selkies, code-server, rustdesk no longer
# depend on fetch, a VMFILE needs no `cream install fetch`. The extension stays
# in the catalog so that `cream upgrade --all` on a machine of 5.4.2 finds it
# (an installed extension missing from its source blocks the upgrade) and the
# consumers of 5.4.2 not yet upgraded still source
# /opt/cream/ext/fetch/fetch.sh — a shim to its own files/fetch.sh. No hooks:
# `cream remove fetch` only takes the tree away.
# No platform.commands: a consumer puts curl on itself.
#
# 1.1.0: fetch.sh is a shim to files/fetch.sh (lib/fetch.sh, laid by the
#        snapshot); summary says it is deprecated.
schema: cream/v1
name: fetch
kind: library
version: 1.1.0
summary: Устарела (не нужна с каталога 5.5.0) — совместимость для потребителей 5.4.2, загрузка с повторами на обрыв соединения
cream: ">=1.0.0"
platform:
  family: deb
  arch: [amd64, arm64]
targets: {build: exec, live: "yes"}
