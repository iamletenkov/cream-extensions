# jetson-stats — jtop, the monitor of NVIDIA Jetson, and its service
# jtop.service; the cloud-init user in the group jtop (owner of /run/jtop.sock).
#
# install   — python3-pip, then jetson-stats by pip with constraints.txt (HOME
#             in a temporary directory, no pip configuration, no --user),
#             jtop.service in place (pip, `jtop --install-service`, the package
#             template or a unit written here) and enabled, the group jtop.
#             Not a Jetson — code 20 (ruling R11).
# configure — stage cloud-user (after cloud-final: the user exists): the user
#             into the group jtop, jtop.service started (--no-block). No order
#             against jtop.service: it is After=multi-user.target, an After= on
#             it here was a cycle on the board.
# remove    — the service off, our unit, pip and apt packages away; the group stays.
#
# Arm64 only: Jetson is an aarch64 module on Tegra; the wheel is py3-none-any
# and would install on amd64 as dead weight.
#
# 3.0.0: cream/v1; configure-jetson-stats.service → stage cloud-user (cream
#        >= 1.1.1, ruling R14); pip with constraints and without traces in
#        root's home; remove.
schema: cream/v1
name: jetson-stats
version: 3.0.1
summary: jtop — монитор NVIDIA Jetson (CPU, GPU, память, питание) и служба jtop.service
cream: ">=1.1.1"
platform:
  family: deb
  arch: [arm64]
targets: {build: exec, live: "yes"}
provides: [jetson-monitor]
depends:
  - {name: cloud-user, version: ">=1.0.0 <2"}
  - {name: apt-guard, version: ">=1.0.0 <2"}
hooks:
  install: {timeout: 20m}
  # Up to 30 s of waiting for the cloud-init user at boot.
  configure: {stage: cloud-user, timeout: 2m}
  remove: {timeout: 10m}
config:
  keys:
    JETSON_STATS_VERSION:
      type: "re:^[0-9]{1,3}(\\.[0-9]{1,3}){1,3}$"
      default: ""
      empty: true
      scope: install
      description: "версия jetson-stats вместо закреплённой в constraints.txt (7.2.1; 4.3.2 на Python 3.6)"
