# code-server — VS Code in a browser, as the cloud-init user, behind a password.
#
# install   — the code-server .deb of the pinned version by sha256 per
#             architecture (GitHub release), openssl for the self-signed
#             certificate code-server issues itself. Starts nothing.
# configure — every boot, stage cloud-user (after cloud-final: the user exists):
#             ~/.config/code-server/config.yaml written AS THE USER (runuser,
#             0600, the password on stdin, never through a symlink), the
#             Teleport declaration /etc/cream/teleport/apps.d/code-server.conf
#             and `systemctl start --no-block code-server@<user>`. Fail-closed:
#             without CODE_SERVER_PASSWORD and without an explicit
#             CODE_SERVER_ALLOW_NO_AUTH=1 the service is not started (a warning,
#             exit 0); no user — a warning and exit 0 (plan ruling R11).
# apply     — after `cream set code-server …`: the same, with a restart.
# remove    — stops the instances, takes away the declaration and the package.
# files     — code-server@.service: User=%i, EnvironmentFile config (no
#             secrets), the wrapper files/code-server.sh start (refuses to start
#             without authentication, exit 78 — not restarted).
#
# 5.0.0: cream/v1 (plan 2026-10-19, Task 15): settings in /etc/cream/code-server/config,
#        the password in /etc/cream/code-server/secrets (secret: file); no password
#        means no start unless CODE_SERVER_ALLOW_NO_AUTH=1; CODE_SERVER_BIND defaults
#        to 127.0.0.1; the .deb by sha256 instead of the install script; mkcert is
#        gone (code-server issues the certificate, cert: true); CODE_SERVER_VERSION
#        is gone. Renames — docs/history/cream-v1-migration.md.
# 5.1.0: hooks.configure.every_boot — configure runs every boot (cream 1.2.0
#        otherwise skips it by the configure mark; audit 2026-10-21).
schema: cream/v1
name: code-server
version: 5.1.2
# 5.1.2: только тест — разборщик teleport берётся из staged-копии (общее ядро lib/teleport-core.sh).
# 5.1.1: только README — единый шаблон README каталога (Task 23 плана bundled-cream).
summary: code-server — VS Code в браузере от имени пользователя; без пароля не стартует, наружу — через Teleport
cream: ">=1.2.0"
platform:
  family: deb
  # The release publishes .deb for amd64 and arm64 (armhf too, never built or
  # checked here — not declared).
  arch: [amd64, arm64]
  os: [{id: debian}, {id: ubuntu}]
targets:
  build: exec
  live: "yes"
provides: [web-ide]
depends:
  - {name: cloud-user, version: ">=1.0.0 <2"}
hooks:
  # The .deb is ~100 MB over the network.
  install: {timeout: 20m}
  # At boot up to 30 s of waiting for the cloud-init user, then one bounded
  # write as the user and non-blocking systemctl.
  configure:
    stage: cloud-user
    every_boot: true
    timeout: 3m
  apply: {timeout: 2m}
  remove: {timeout: 10m}
files:
  - {src: files/code-server@.service, dst: /etc/systemd/system/code-server@.service, mode: "0644"}
# Every value reaches a YAML file of the user, a unit name or a Teleport
# declaration: the types admit no newline, quote, $, backquote, backslash or
# space (tests/test-code-server.sh).
config:
  keys:
    CODE_SERVER_USER:
      type: 're:^[a-z_][a-z0-9_-]{0,31}$'
      default: ""
      empty: true
      description: "пользователь; пусто — из cloud-init (библиотека cloud-user); root — нельзя"
    CODE_SERVER_PASSWORD:
      type: 're:^[A-Za-z0-9!#%&()*+,./:;<=>?@^_{|}~\[\]-]{8,128}$'
      default: ""
      empty: true
      secret: file
      description: "пароль: 8–128 знаков без пробелов, кавычек, $ и обратной косой; без него служба не стартует"
    CODE_SERVER_PORT: {type: port, default: "9001", description: "порт"}
    CODE_SERVER_BIND:
      type: 're:^[A-Za-z0-9.:-]{1,253}$'
      default: "127.0.0.1"
      description: "адрес прослушивания; снаружи — через Teleport или ssh-туннель"
    CODE_SERVER_ALLOW_NO_AUTH:
      type: bool
      default: "0"
      description: "1 — запускать без пароля (шелл пользователя любому, кто достаёт до адреса; предупреждение при каждом старте)"
