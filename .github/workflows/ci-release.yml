name: CI and Release

# Выпуск — release-please, как в bisquite: на main после проверок он ведёт
# PR «release X.Y.Z» (CHANGELOG.md); слияние этого PR создаёт тег vX.Y.Z и
# опубликованный релиз с заметками. К релизу job release-assets прикладывает
# снимок каталога cream-extensions-<v>.tar.gz (tools/catalog-snapshot.sh:
# детерминированный `cream catalog pack` по пину cream, собранный на теге),
# BUILDINFO.json, SHA256SUMS и его подпись cosign ключом stvor-platform —
# SHA256SUMS.sig и SHA256SUMS.bundle.json (tools/release-sign.sh, та же схема,
# что у релиза форка Teleport). Снимок по пину sha256 берут Stvor и bisquite
# (`cream source add --archive … --sha256 …`). Версия каталога в
# cream-catalog.yaml поднимается тем же release-please. Теги руками не ставят.
#
# Job проверок гоняет tools/check.sh — `cream validate --catalog .` по корню
# (tools/cream-validate.sh: cream по пину tools/cream-pin.env в контейнере
# debian:12), гейт имён, линт хуков, тесты инструментов и расширений.
#
# Почему это вообще заведено: проверки существовали только как ручные
# скрипты, и расхождения ничем не ловились на пути в репозиторий. Проверка,
# которую надо не забыть запустить, — это не проверка.
#
# Почему ubuntu-latest, а не [self-hosted, linux, x64], как в основном
# репозитории: там раннер нужен ради docker, Nuitka и деба, здесь — только bash
# и Python с PyYAML. Плюс job, приколоченный к раннеру, которого у этого
# репозитория может не оказаться, не падает, а висит в очереди навсегда — это
# хуже красного CI. Появится свой раннер — меняется одна строка.

# Ветки проверяются на pull_request (результат слияния с main), push — только
# main: там релиз. push во все ветки вместе с pull_request гонял CI дважды на
# каждый коммит PR. Ветку без PR — черновым PR или вручную (workflow_dispatch).
# Ветки feature/cream-v1-* (интеграционная feature/cream-v1-migration плана
# 2026-10-19) проверяются тем же check.sh. Живые прогоны — live.yml.
on:
  pull_request:
    branches: [main, "feature/cream-v1-*"]
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию — ничего; каждый job называет свои права сам. Запись — только
# у release-please (тег, PR релиза) и release-assets (файлы и подпись к релизу).
permissions: {}

# Отменять устаревший прогон можно только на PR: на main отмена посреди
# release-please оставила бы релиз недоделанным.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # История и теги — для правила версий (tools/check-version-bump.sh
      # сравнивает дерево каждого расширения с последним тегом v*); без них
      # оно отказывает, а не пропускает.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Секреты в дереве — тот же gitleaks и тот же .gitleaks.toml, что на
      # pre-commit; образ закреплён по версии.
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner -v

      # PyYAML на образе раннера присутствует, но это деталь образа, а не
      # контракт: ставим явно, чтобы обновление образа не выключило молча
      # проверки, читающие манифесты (lint-hooks.sh, hooktest.sh, тесты).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      # Соседняя копия stvor-agent для tools/check-contract-fixtures.sh:
      # файлы-образцы контракта управляемых меток (эталон —
      # internal/teleport/testdata) сверяются с копией в
      # extensions/debian/teleport/tests/fixtures. Ref — переменная репозитория
      # STVOR_AGENT_REF (умолчание main; до слияния Go-агента в main stvor-agent
      # — feature/go-agent). Без копии в CI сверка красная, а не пропуск.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: iamletenkov/stvor-agent
          ref: ${{ vars.STVOR_AGENT_REF || 'main' }}
          path: .stvor-agent
          persist-credentials: false

      # Одна точка входа, та же, что запускают руками: CI и локальный прогон
      # не должны расходиться. check.sh доводит до конца все проверки, даже
      # если первая упала, — в логе видны все ошибки, а не первая.
      - name: Run repository checks
        env:
          STVOR_AGENT_DIR: ${{ github.workspace }}/.stvor-agent
        run: tools/check.sh

      # shellcheck (на образе раннера есть) — та же цель, что в make ci
      # и на pre-push: планка -S error, см. tools/lint.sh.
      - name: Shellcheck
        run: make lint

  # Расширения семейства openwrt на настоящем OpenWrt 25.12: корневая ФС
  # openwrt-builder v0.3.1 (sha256 закреплён в tools/test-openwrt.sh) в
  # контейнере, cream по пину, настоящие uci, awg, init-скрипт podkop.
  openwrt:
    name: test-openwrt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: OpenWrt scenario
        run: make test-openwrt

  release-please:
    name: Release Please
    needs: [check, openwrt]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: .github/release_please/release-please-config.json
          manifest-file: .github/release_please/.release-please-manifest.json
          # PAT владельца (RELEASE_PR_TOKEN): PR релиза от GITHUB_TOKEN не запускает
          # CI. Тег и релиз от PAT ничего не запускают — триггеров на теги и
          # релизы нет. Без секрета — GITHUB_TOKEN, как раньше.
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

  # Сухой прогон выпуска снимка на PR: та же сборка, что на теге, без
  # загрузки и без прав на запись. Воспроизводимость и приёмку снимка cream
  # проверяет check.sh (tools/test-snapshot.sh); здесь — что сборка в том
  # виде, в каком её зовёт release-assets, проходит и даёт файлы.
  snapshot-dry-run:
    name: Snapshot (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build snapshot
        run: tools/catalog-snapshot.sh dist

      # Подпись — тем же скриптом, что на теге, но одноразовым ключом: секретов
      # environment release на PR нет и не должно быть. Тест скрипта с cosign —
      # полный круг: подпись, проверка без сети, отказ на подмене и чужом ключе.
      - name: cosign by sha256
        run: tools/release-sign.sh install "$RUNNER_TEMP/bin"

      - name: Signing round trip (throwaway key)
        env:
          COSIGN: ${{ runner.temp }}/bin/cosign
        run: |
          set -euo pipefail
          tools/test-release-sign.sh
          v="$(sed -nE 's/^version:[[:space:]]*"?([0-9.]+)"?.*/\1/p' cream-catalog.yaml | head -n1)"
          tools/release-sign.sh buildinfo dist "v$v"
          k="$RUNNER_TEMP/key"; mkdir -p "$k"
          export COSIGN_PASSWORD="dry-run-$GITHUB_RUN_ID"
          (cd "$k" && "$COSIGN" generate-key-pair >/dev/null)
          COSIGN_PRIVATE_KEY="$(cat "$k/cosign.key")" tools/release-sign.sh sign dist
          tools/release-sign.sh verify dist "$k/cosign.pub"

      - name: Show snapshot (no upload)
        run: |
          set -euo pipefail
          ls -l dist
          cat dist/BUILDINFO.json
          (cd dist && sha256sum -c SHA256SUMS)
          echo "Сухой прогон: снимок собран и подписан одноразовым ключом, к релизу не загружается"

  # Снимок каталога к созданному релизу — два job'а. release-build собирает
  # снимок на теге (не на голове main — байты должны соответствовать тегу) без
  # секретов и отдаёт его artifact'ом. release-assets — в environment release
  # с секретами подписи — код тега не выполняет: берёт artifact и только
  # инструменты коммита этого workflow (github.workflow_sha).
  release-build:
    name: Release snapshot build
    needs: release-please
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Build snapshot on the tag
        run: tools/catalog-snapshot.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Подпись и загрузка. Коммит тега сверяется: он — предок main (тег не
  # указывает в сторону), а BUILDINFO.json пишется здесь, инструментом
  # workflow_sha, с коммитом тега и суммой снимка из artifact'а. Затем
  # SHA256SUMS (снимок + BUILDINFO.json), подпись ключом stvor-platform без
  # Rekor, её проверка без сети публичным ключом из release/keys, и только
  # потом gh release upload. Нет секрета — job красный, релиз без файлов,
  # dispatch-* не запускаются. Перед подписью — сверка с опубликованным
  # релизом (tools/release-sign.sh reconcile): подписанный релиз неизменяем.
  # Опубликованный файл (в том числе SHA256SUMS) не совпал с пересборкой —
  # отказ, без переподписи и --clobber; полная подпись, проверенная ключом,
  # сохраняется и догружаются только недостающие файлы; подписи нет или она
  # неполная — подпись заново, --clobber только для неполной подписи.
  #
  # Секреты COSIGN_PRIVATE_KEY и COSIGN_PASSWORD — только в environment
  # release (только ветка main); job объявляет его и потому их видит.
  release-assets:
    name: Release snapshot assets
    needs: [release-please, release-build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # Инструменты — из коммита workflow, не из тега; история и теги — чтобы
      # сверить коммит тега.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-snapshot
          path: dist

      - name: Tag commit is on main
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег релиза должен иметь вид vX.Y.Z, получено: '$TAG'"
            exit 1
          fi
          git fetch -q --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/origin/main"
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Коммит тега $TAG ($commit) — не предок main: подпись отказана"
            exit 1
          fi
          echo "тег $TAG → $commit, предок main"

      - name: cosign by sha256
        run: tools/release-sign.sh install "$RUNNER_TEMP/bin"

      - name: BUILDINFO.json and SHA256SUMS
        run: |
          set -euo pipefail
          ls -l dist
          REF="refs/tags/$TAG" tools/release-sign.sh buildinfo dist "$TAG"
          { echo "### $TAG"; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Подписанный релиз неизменяем (tools/release-sign.sh reconcile):
      # опубликованный файл (в том числе SHA256SUMS) не совпал с пересборкой
      # байт в байт — отказ, без переподписи и замены; .sig и .bundle.json
      # опубликованы и проверяются — подпись сохраняется, догружаются только
      # недостающие файлы; подписи нет или она неполная — подпись заново.
      - name: Reconcile with the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN: ${{ runner.temp }}/bin/cosign
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/prev"; mkdir -p "$p"
          names="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in $(cd dist && ls) SHA256SUMS.sig SHA256SUMS.bundle.json; do
            if grep -qxF "$f" <<<"$names"; then
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$p" -p "$f"
            fi
          done
          tools/release-sign.sh reconcile dist "$p" release/keys/stvor-platform.pub "$RUNNER_TEMP/plan"
          echo "ACTION=$(cat "$RUNNER_TEMP/plan/action")" >> "$GITHUB_ENV"

      - name: Sign SHA256SUMS (cosign, key stvor-platform, no Rekor)
        if: env.ACTION == 'sign'
        env:
          COSIGN: ${{ runner.temp }}/bin/cosign
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: tools/release-sign.sh sign dist

      - name: Verify the signature without network
        env:
          COSIGN: ${{ runner.temp }}/bin/cosign
        run: tools/release-sign.sh verify dist release/keys/stvor-platform.pub

      - name: Upload snapshot to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          asset="dist/cream-extensions-${BASH_REMATCH[1]}.tar.gz"
          if [ ! -f "$asset" ]; then
            echo "::error::Нет $asset: версия в cream-catalog.yaml не совпала с тегом $TAG"
            ls -l dist
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          # Только недостающие файлы, без --clobber; --clobber — лишь для
          # неполной подписи, которую заменяет новая. Подпись — последней.
          plan="$RUNNER_TEMP/plan"
          mapfile -t up < <(grep -vx 'SHA256SUMS.sig\|SHA256SUMS.bundle.json' "$plan/upload" || true)
          mapfile -t upsig < <(grep -x 'SHA256SUMS.sig\|SHA256SUMS.bundle.json' "$plan/upload" || true)
          mapfile -t clob < "$plan/clobber"
          cd dist
          if [ "${#up[@]}" -gt 0 ]; then gh release upload "$TAG" "${up[@]}" -R "$GITHUB_REPOSITORY"; fi
          if [ "${#clob[@]}" -gt 0 ]; then gh release upload "$TAG" "${clob[@]}" --clobber -R "$GITHUB_REPOSITORY"; fi
          if [ "${#upsig[@]}" -gt 0 ]; then gh release upload "$TAG" "${upsig[@]}" -R "$GITHUB_REPOSITORY"; fi
          echo "загружено: ${up[*]} ${upsig[*]}; заменено: ${clob[*]}"

  # check-names: off — BISQUITE_* ниже — имена секрета и переменной GitHub, не ключи
  # Релиз сам поднимает расширения в bisquite: запускает там
  # extensions-bump.yml, который ставит указатель подмодуля и версию
  # в примерах на этот тег и открывает PR.
  #
  # Токен — BISQUITE_DISPATCH_TOKEN: fine-grained PAT только на
  # iamletenkov/bisquite с правом Actions: Read and write. Код он пушить
  # не может — ветку и PR в bisquite делает уже GITHUB_TOKEN того workflow.
  # GITHUB_TOKEN этого репозитория чужой workflow запустить не может.
  #
  # Только push в main: на pull_request секретов нет, а pull_request_target
  # здесь не нужен и опасен. Без секрета (форк, чужой клон) шаг пропускается
  # с предупреждением; в iamletenkov/cream-extensions это отказ.
  # Ждёт release-assets: bump в bisquite пинит снимок, он должен уже лежать
  # в релизе.
  dispatch-bisquite:
    name: Bump extensions in bisquite
    needs: [release-please, release-assets]
    # Выключено, пока bisquite не применяет расширения через cream (каталог 4.x
    # несовместим со старой директивой EXTENSION): включается переменной
    # репозитория BISQUITE_BUMP_ENABLED=true.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true' &&
      vars.BISQUITE_BUMP_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch extensions-bump.yml
        env:
          GH_TOKEN: ${{ secrets.BISQUITE_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET_REPO: iamletenkov/bisquite
          HOME_REPO: iamletenkov/cream-extensions
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег релиза должен иметь вид vX.Y.Z, получено: '$TAG'"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_REPOSITORY" = "$HOME_REPO" ]; then
              echo "::error::Нет секрета BISQUITE_DISPATCH_TOKEN — bisquite не узнает о $TAG"
              exit 1
            fi
            echo "::warning::Нет секрета BISQUITE_DISPATCH_TOKEN — подъём в bisquite пропущен"
            exit 0
          fi
          gh workflow run extensions-bump.yml -R "$TARGET_REPO" --ref main -f tag="$TAG"
          echo "Запущен extensions-bump.yml в $TARGET_REPO для $TAG"
  # check-names: on

  # Выпуск каталога поднимает пин снимка в портале Stvor: запускает там
  # robot-pins-bump.yml (component=cream-extensions), который берёт
  # SHA256SUMS выпуска, ставит CREAM_EXTENSIONS_VERSION/_SHA256 в
  # .env.example и открывает PR. Ждёт release-assets: снимок должен уже
  # лежать в выпуске.
  #
  # Выключатель — переменная репозитория STVOR_BUMP_ENABLED=true. Токен —
  # STVOR_DISPATCH_TOKEN: fine-grained PAT только на iamletenkov/stvor с
  # правом Actions: Read and write (ветку и PR там делает GITHUB_TOKEN того
  # workflow). Нет секрета — предупреждение в журнале, job зелёный: выпуск
  # каталога от портала не зависит.
  dispatch-stvor:
    name: Bump catalog in stvor
    needs: [release-please, release-assets]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch robot-pins-bump.yml
        env:
          GH_TOKEN: ${{ secrets.STVOR_DISPATCH_TOKEN }}
          ENABLED: ${{ vars.STVOR_BUMP_ENABLED }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET_REPO: iamletenkov/stvor
        run: |
          set -euo pipefail
          if [ "$ENABLED" != true ]; then
            echo "::notice::STVOR_BUMP_ENABLED не true — подъём пина $TAG в $TARGET_REPO пропущен"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег релиза должен иметь вид vX.Y.Z, получено: '$TAG'"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Нет секрета STVOR_DISPATCH_TOKEN — подъём пина $TAG в $TARGET_REPO пропущен"
            exit 0
          fi
          gh workflow run robot-pins-bump.yml -R "$TARGET_REPO" --ref main \
            -f component=cream-extensions -f tag="$TAG"
          echo "Запущен robot-pins-bump.yml в $TARGET_REPO для $TAG"
