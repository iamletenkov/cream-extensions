name: Build graphical stack

# Сборка графического стека в образе (спека 2026-11-12-existing-desktop §8,
# план — Task 19, рулинг П29): настоящий cream по пину ставит gnome, desktop,
# selkies, x11vnc и existing-desktop (на образе с готовым gdm3) внутри
# облачного образа ubuntu-24.04 amd64 под virt-customize — фаза build, как в
# bisquite. Сценарии и проверки — tools/build-graphical.sh.
#
# Когда (решение владельца 2026-11-12): в PR, которые меняют эти расширения,
# их зависимости или общие lib/ (фильтр путей), и вручную. Не ночью; PR
# выпуска (release-please) и PR несвязанных расширений её не запускают.
# Раннер — hosted ubuntu-latest: /dev/kvm там есть, доступ к нему открывает
# udev-правило; self-hosted не нужен.
on:
  pull_request:
    branches: [main]
    paths:
      - "extensions/debian/gnome/**"
      - "extensions/debian/desktop/**"
      - "extensions/debian/selkies/**"
      - "extensions/debian/x11vnc/**"
      - "extensions/debian/existing-desktop/**"
      - "extensions/debian/cloud-user/**"
      - "extensions/debian/apt-guard/**"
      - "lib/**"
      - "tools/build-graphical.sh"
      - "tools/catalog-snapshot.sh"
      - "tools/cream-deb.sh"
      - "tools/cream-pin.env"
      - ".github/workflows/build-graphical.yml"
  workflow_dispatch:
    inputs:
      scenario:
        description: "сценарий (all — все)"
        type: choice
        options: [all, cream-gnome, existing-gdm3]
        default: all

permissions: {}

concurrency:
  group: build-graphical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.scenario }} (ubuntu-24.04 amd64)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Вручную — один сценарий из списка choice, иначе все.
        scenario: >-
          ${{ fromJSON((inputs.scenario && inputs.scenario != 'all')
          && format('["{0}"]', inputs.scenario)
          || '["cream-gnome","existing-gdm3"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # /dev/kvm на hosted-раннере есть, но доступен только группе kvm.
      - name: KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # libguestfs собирает appliance из ядра хоста, а ядро Ubuntu читает только root.
      - name: libguestfs
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q libguestfs-tools qemu-utils
          sudo chmod 0644 /boot/vmlinuz-*

      - name: tools/build-graphical.sh
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: tools/build-graphical.sh "$SCENARIO"

      - name: Logs of the guest
        if: failure()
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          d=".scratchpad/build-graphical/$SCENARIO/logs"
          for f in "$d"/*.rc; do echo "${f##*/}: $(cat "$f")"; done || true
          tail -n 60 "$d"/*.err || true
